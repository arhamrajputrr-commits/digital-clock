<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Year End Countdown</title>
  <link rel="stylesheet" href="./style.css
  ">
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>@view-transition { navigation: auto; }</style>
   <script src="/_sdk/data_sdk.js" type="text/javascript"></script> 
 </head>



 <body class="h-full m-0 p-0 bg-black text-white overflow-auto">
  <div id="app-wrapper" class="min-h-full w-full dot-pattern flex flex-col items-center justify-center p-4 sm:p-8 relative"><!-- Decorative Elements -->
   <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="orbit-ring absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border border-white/5 rounded-full"></div>
    <div class="orbit-ring-reverse absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] border border-white/3 rounded-full"></div>
    <div class="absolute top-10 left-10 w-2 h-2 bg-white/20 rounded-full"></div>
    <div class="absolute top-20 right-20 w-1 h-1 bg-white/30 rounded-full"></div>
    <div class="absolute bottom-20 left-1/4 w-1.5 h-1.5 bg-white/15 rounded-full"></div>
   </div><!-- Main Content -->
   <div class="relative z-10 text-center max-w-4xl w-full"><!-- Header -->
    <div class="mb-8 sm:mb-12 slide-up">
     <h1 id="main-title" class="text-3xl sm:text-5xl md:text-6xl font-bold shimmer-text mb-3">COUNTDOWN TO 2026</h1>
     <p id="subtitle" class="text-white/50 text-sm sm:text-base tracking-widest uppercase">Every second counts</p>
    </div><!-- Current Date Display -->
    <div class="glass-effect rounded-2xl px-4 sm:px-6 py-3 sm:py-4 inline-block mb-8 sm:mb-12 slide-up slide-up-delay-1">
     <div class="flex items-center gap-3">
      <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div><span id="date" class="mono text-white/70 text-xs sm:text-sm"></span>
     </div>
    </div><!-- Countdown Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 md:gap-6 mb-8 sm:mb-12"><!-- Days -->
     <div class="countdown-card rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 slide-up slide-up-delay-1">
      <div class="relative">
       <svg class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 mx-auto mb-3 sm:mb-4" viewbox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" /> <circle id="days-progress" cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="2" class="progress-ring" transform="rotate(-90 50 50)" />
       </svg>
       <div class="absolute inset-0 flex items-center justify-center"><span id="days" class="mono text-2xl sm:text-3xl md:text-4xl font-bold number-display">000</span>
       </div>
      </div>
      <p class="text-white/40 text-xs sm:text-sm uppercase tracking-wider">Days</p>
     </div><!-- Hours -->
     <div class="countdown-card rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 slide-up slide-up-delay-2">
      <div class="relative">
       <svg class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 mx-auto mb-3 sm:mb-4" viewbox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" /> <circle id="hours-progress" cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="2" class="progress-ring" transform="rotate(-90 50 50)" />
       </svg>
       <div class="absolute inset-0 flex items-center justify-center"><span id="hours" class="mono text-2xl sm:text-3xl md:text-4xl font-bold number-display">00</span>
       </div>
      </div>
      <p class="text-white/40 text-xs sm:text-sm uppercase tracking-wider">Hours</p>
     </div><!-- Minutes -->
     <div class="countdown-card rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 slide-up slide-up-delay-3">
      <div class="relative">
       <svg class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 mx-auto mb-3 sm:mb-4" viewbox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" /> <circle id="minutes-progress" cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="2" class="progress-ring" transform="rotate(-90 50 50)" />
       </svg>
       <div class="absolute inset-0 flex items-center justify-center"><span id="minutes" class="mono text-2xl sm:text-3xl md:text-4xl font-bold number-display">00</span>
       </div>
      </div>
      <p class="text-white/40 text-xs sm:text-sm uppercase tracking-wider">Minutes</p>
     </div><!-- Seconds -->
     <div class="countdown-card seconds-card rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 slide-up slide-up-delay-4">
      <div class="relative">
       <svg class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 mx-auto mb-3 sm:mb-4" viewbox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" /> <circle id="seconds-progress" cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="2" class="progress-ring" transform="rotate(-90 50 50)" />
       </svg>
       <div class="absolute inset-0 flex items-center justify-center"><span id="seconds" class="mono text-2xl sm:text-3xl md:text-4xl font-bold number-display">00</span>
       </div>
      </div>
      <p class="text-white/40 text-xs sm:text-sm uppercase tracking-wider">Seconds</p>
     </div>
    </div><!-- Year Progress Bar -->
    <div class="glass-effect rounded-xl sm:rounded-2xl p-4 sm:p-6 slide-up slide-up-delay-4">
     <div class="flex justify-between items-center mb-3"><span class="text-white/50 text-xs sm:text-sm">Year Progress</span> <span id="year-percent" class="mono text-white text-xs sm:text-sm font-medium">0%</span>
     </div>
     <div class="h-1.5 sm:h-2 bg-white/10 rounded-full overflow-hidden">
      <div id="year-progress-bar" class="h-full bg-gradient-to-r from-white/50 to-white rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
     </div>
     <div class="flex justify-between mt-2"><span class="text-white/30 text-xs">Jan 1</span> <span class="text-white/30 text-xs">Dec 31</span>
     </div>
    </div>
   </div>
  </div>
  <script>
        const defaultConfig = {
            main_title: "COUNTDOWN TO 2026",
            subtitle_text: "Every second counts"
        };
        
        let config = { ...defaultConfig };
        
        function updateUI() {
            document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
            document.getElementById('subtitle').textContent = config.subtitle_text || defaultConfig.subtitle_text;
        }
        
        function setProgress(elementId, value, max) {
            const circumference = 283;
            const progress = (value / max) * circumference;
            const offset = circumference - progress;
            document.getElementById(elementId).style.strokeDashoffset = offset;
        }
        
        function updateCountdown() {
            const now = new Date();
            const endYear = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
            const startYear = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
            const diff = endYear - now;
            const totalYear = endYear - startYear;
            const elapsed = now - startYear;
            const yearProgress = (elapsed / totalYear) * 100;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            
            document.getElementById('days').textContent = String(days).padStart(3, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
            
            setProgress('days-progress', days, 365);
            setProgress('hours-progress', hours, 24);
            setProgress('minutes-progress', minutes, 60);
            setProgress('seconds-progress', seconds, 60);
            
            document.getElementById('year-percent').textContent = yearProgress.toFixed(2) + '%';
            document.getElementById('year-progress-bar').style.width = yearProgress + '%';
        }
        
        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange: async (newConfig) => {
                    config = { ...defaultConfig, ...newConfig };
                    updateUI();
                },
                mapToCapabilities: (config) => ({
                    recolorables: [],
                    borderables: [],
                    fontEditable: undefined,
                    fontSizeable: undefined
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["main_title", config.main_title || defaultConfig.main_title],
                    ["subtitle_text", config.subtitle_text || defaultConfig.subtitle_text]
                ])
            });
        }
        
        updateUI();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
